# JackBus's own ALSA plugin: an application's PCM straight to JackBus, at
# JackBus's rate (no resampling, no PipeWire, no loopback card).
#
#   aplay -D jackbus file.wav
#   pcm.!default jackbus     (in ~/.asoundrc: every ALSA application)
#
# Options: name "<JACK client name>", server "<JACK server>", autoconnect <bool>.

pcm.jackbus {
	@args [ NAME SERVER AUTOCONNECT ]
	@args.NAME { type string default "" }
	@args.SERVER { type string default "" }
	@args.AUTOCONNECT { type string default "yes" }
	type jackbus
	name $NAME
	server $SERVER
	autoconnect $AUTOCONNECT
	hint {
		show on
		description "JackBus (direct)"
	}
}
