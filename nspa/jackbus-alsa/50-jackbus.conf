# JackBus's own ALSA plugin: an application's PCM straight to JackBus (no
# PipeWire, no loopback card; JackBus's rate, another resampled as a fallback).
#
#   aplay -D jackbus file.wav
#   every ALSA application, in ~/.config/alsa/asoundrc (PatchBox writes it):
#     pcm.!default { type jackbus fallback "pipewire" }
#   on JackBus while it runs, on PipeWire while it doesn't
#
# Options: name "<JACK client name>", server "<JACK server>", autoconnect <bool>,
# fallback "<PCM opened while JackBus isn't running>".

pcm.jackbus {
	@args [ NAME SERVER AUTOCONNECT FALLBACK ]
	@args.NAME { type string default "" }
	@args.SERVER { type string default "" }
	@args.AUTOCONNECT { type string default "yes" }
	@args.FALLBACK { type string default "" }
	type jackbus
	name $NAME
	server $SERVER
	autoconnect $AUTOCONNECT
	fallback $FALLBACK
	hint {
		show on
		description "JackBus (direct)"
	}
}
